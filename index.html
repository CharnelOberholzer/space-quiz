<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ff">
  <title>Cosmic Quest — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f5ff;
      --surface: rgba(255, 255, 255, .9);
      --surface-solid: #fff;
      --ink: #242344;
      --muted: #747391;
      --line: #e8e6f4;
      --purple: #7555e8;
      --purple-dark: #5d3dc8;
      --pink: #f08bc5;
      --green: #148254;
      --green-bg: #e4f8ed;
      --red: #c4364d;
      --red-bg: #fff0f1;
      --panel-edge: #dcd7f1;
      --panel-grid: rgba(117, 85, 232, .055);
      --status: #148254;
      --status-bg: #e4f8ed;
      --shadow: 0 24px 70px rgba(51, 39, 112, .13);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      isolation: isolate;
      background:
        radial-gradient(ellipse at 12% 14%, rgba(240, 139, 197, .2), transparent 30%),
        radial-gradient(ellipse at 88% 82%, rgba(117, 85, 232, .18), transparent 34%),
        var(--page);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      background-image:
        radial-gradient(2.5px 2.5px at 8% 18%, rgba(117, 85, 232, .68) 50%, transparent 100%),
        radial-gradient(2px 2px at 23% 76%, rgba(240, 139, 197, .72) 50%, transparent 100%),
        radial-gradient(2.5px 2.5px at 38% 32%, rgba(117, 85, 232, .62) 50%, transparent 100%),
        radial-gradient(2px 2px at 57% 88%, rgba(240, 139, 197, .66) 50%, transparent 100%),
        radial-gradient(2.5px 2.5px at 72% 15%, rgba(117, 85, 232, .66) 50%, transparent 100%),
        radial-gradient(2px 2px at 91% 57%, rgba(240, 139, 197, .7) 50%, transparent 100%);
      background-repeat: repeat;
      background-size: 360px 320px;
      content: "";
      opacity: .62;
      pointer-events: none;
      animation: star-glimmer 8s ease-in-out infinite alternate;
    }

    button { font: inherit; }

    .quiz {
      position: relative;
      width: min(100%, 470px);
      padding: 30px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--panel-edge);
      border-radius: 26px;
      background:
        linear-gradient(var(--panel-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--panel-grid) 1px, transparent 1px),
        linear-gradient(145deg, var(--surface), var(--surface-solid));
      background-size: 24px 24px, 24px 24px, auto;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .78);
      backdrop-filter: blur(14px);
    }

    .quiz::before {
      position: absolute;
      z-index: -1;
      top: -94px;
      right: -82px;
      width: 205px;
      height: 205px;
      border: 1px solid rgba(117, 85, 232, .12);
      border-radius: 50%;
      box-shadow: 0 0 0 18px rgba(117, 85, 232, .035), 0 0 0 38px rgba(240, 139, 197, .035);
      content: "";
    }

    .quiz::after {
      position: absolute;
      top: 0;
      right: 28px;
      left: 28px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, #7555e8, #f08bc5 68%, #64d7bd);
      content: "";
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-name {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(145deg, #8569ef, #f08bc5);
      color: #fff;
      font-size: 18px;
      box-shadow: 0 5px 14px rgba(117, 85, 232, .25);
    }

    .brand-status {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid color-mix(in srgb, var(--status) 22%, transparent);
      border-radius: 999px;
      background: var(--status-bg);
      color: var(--status);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .08em;
      line-height: 1;
    }

    .brand-status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 15%, transparent);
      content: "";
    }

    .screen[hidden] { display: none; }

    .intro { padding: 24px 2px 22px; text-align: center; }

    .hero-emoji {
      display: grid;
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      place-items: center;
      border-radius: 26px;
      background: linear-gradient(145deg, #eee9ff, #ffeaf6);
      font-size: 43px;
      animation: float 3.5s ease-in-out infinite;
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font-size: clamp(27px, 7vw, 34px); line-height: 1.15; letter-spacing: -.045em; }
    h2 { margin-bottom: 18px; font-size: 22px; line-height: 1.3; letter-spacing: -.025em; }
    .intro p, .result p { max-width: 335px; margin: 0 auto 22px; color: var(--muted); }
    .eyebrow { margin: 0 0 8px; color: var(--purple); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(110deg, var(--purple), #9867e9);
      color: #fff;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(117, 85, 232, .24);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .button[hidden] { display: none; }
    .button:hover { transform: translateY(-2px); box-shadow: 0 11px 22px rgba(117, 85, 232, .3); }
    .button:active { transform: translateY(0); }
    .button:focus-visible, .answer:focus-visible { outline: 3px solid #f0a4d1; outline-offset: 3px; }

    .quiz-top { margin-bottom: 25px; }
    .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .score { padding: 5px 10px; border-radius: 999px; background: #f0edff; color: var(--purple-dark); }
    .progress-track { height: 9px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .progress-fill { width: 10%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7555e8, #f08bc5); transition: width .45s cubic-bezier(.2,.75,.2,1); }

    .question-number { margin-bottom: 7px; color: var(--purple); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .answers { display: grid; gap: 10px; }
    .answer {
      display: flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-solid);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease, color .2s ease;
    }
    .answer:hover:not(:disabled) { transform: translateY(-1px); border-color: #c9bdf5; background: #faf9ff; }
    .answer-letter {
      display: grid;
      flex: 0 0 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      background: #f2f0fa;
      color: #777493;
      font-size: 12px;
      font-weight: 800;
    }
    .answer.correct { border-color: #6bc79a; background: var(--green-bg); color: var(--green); animation: pop .35s ease both; }
    .answer.correct .answer-letter { background: #c6efd8; color: #126943; }
    .answer.wrong { border-color: #ee8891; background: var(--red-bg); color: var(--red); animation: shake .38s ease both; }
    .answer.wrong .answer-letter { background: #ffd7db; color: #a52a3d; }
    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 28px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }
    .actions { display: flex; justify-content: flex-end; margin-top: 10px; }
    .button.next { min-width: 145px; }

    .result { position: relative; padding: 16px 0 12px; text-align: center; }
    .result > :not(.celebration-confetti) { position: relative; z-index: 1; }
    .result-emoji {
      display: grid;
      width: 98px;
      height: 98px;
      margin: 0 auto 20px;
      place-items: center;
      border-radius: 32px;
      background: linear-gradient(145deg, #eee9ff, #ffeaf6);
      font-size: 52px;
      animation: pop .5s cubic-bezier(.2,1.5,.5,1) both;
    }
    .celebration-confetti {
      position: absolute;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .celebration-confetti[hidden] { display: none; }
    .confetti-piece {
      position: absolute;
      top: 35%;
      left: 50%;
      width: 9px;
      height: 13px;
      border-radius: 3px;
      background: var(--confetti-color);
      opacity: 0;
      transform: translate(var(--confetti-x), var(--confetti-y)) rotate(var(--confetti-rotation));
      animation: confetti-burst .9s cubic-bezier(.15,.75,.3,1) both;
    }
    .result.celebrate .result-emoji {
      box-shadow: 0 0 0 9px rgba(251, 191, 36, .12), 0 12px 30px rgba(240, 139, 197, .3);
      animation: celebrate-pop .7s cubic-bezier(.2,1.5,.5,1) both;
    }
    .result.celebrate .final-score {
      background: linear-gradient(100deg, #fff2bf, #ffe2f3);
      color: #7043a8;
    }
    .final-score { display: inline-flex; margin: 0 0 18px; padding: 8px 15px; border-radius: 999px; background: #f0edff; color: var(--purple-dark); font-weight: 800; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
    @keyframes pop { 0% { transform: scale(.92); } 65% { transform: scale(1.04); } 100% { transform: scale(1); } }
    @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } 100% { transform: translateX(0); } }
    @keyframes star-glimmer { from { opacity: .48; } to { opacity: .72; } }
    @keyframes celebrate-pop { 0% { transform: scale(.65) rotate(-12deg); } 65% { transform: scale(1.12) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes confetti-burst {
      0% { opacity: 0; transform: translate(0, 0) rotate(0) scale(.2); }
      18% { opacity: 1; }
      100% { opacity: .9; transform: translate(var(--confetti-x), var(--confetti-y)) rotate(var(--confetti-rotation)) scale(1); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111020;
        --surface: rgba(30, 28, 49, .92);
        --surface-solid: #28263e;
        --ink: #f3f1ff;
        --muted: #b4b0cb;
        --line: #403c59;
        --purple: #b4a0ff;
        --purple-dark: #d0c5ff;
        --green: #72e2a3;
        --green-bg: #183d30;
        --red: #ff929d;
        --red-bg: #482c37;
        --panel-edge: #4b4567;
        --panel-grid: rgba(190, 176, 255, .075);
        --status: #80e5af;
        --status-bg: #1c3c32;
        --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      }
      .quiz { box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .09); }
      .score, .final-score { background: #393253; }
      .answer-letter { background: #39364f; color: #d0cce4; }
      .answer:hover:not(:disabled) { border-color: #7966b3; background: #302d49; }
      .answer.correct .answer-letter { background: #245842; color: #c1f4d6; }
      .answer.wrong .answer-letter { background: #643541; color: #ffd2d6; }
      .hero-emoji, .result-emoji { background: linear-gradient(145deg, #353050, #492e49); }
      .result.celebrate .final-score { background: linear-gradient(100deg, #554321, #593650); color: #ffe7a0; }
      body::before {
        background-image:
          radial-gradient(2.5px 2.5px at 8% 18%, rgba(205, 192, 255, .82) 50%, transparent 100%),
          radial-gradient(2px 2px at 23% 76%, rgba(255, 171, 218, .78) 50%, transparent 100%),
          radial-gradient(2.5px 2.5px at 38% 32%, rgba(205, 192, 255, .72) 50%, transparent 100%),
          radial-gradient(2px 2px at 57% 88%, rgba(255, 171, 218, .72) 50%, transparent 100%),
          radial-gradient(2.5px 2.5px at 72% 15%, rgba(205, 192, 255, .78) 50%, transparent 100%),
          radial-gradient(2px 2px at 91% 57%, rgba(255, 171, 218, .76) 50%, transparent 100%);
      }
    }

    @media (max-width: 520px) {
      body { padding: 18px 12px; }
      .quiz { padding: 23px 19px; border-radius: 22px; }
      .brand { margin-bottom: 15px; }
      .intro { padding: 18px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      body::before { animation: none; }
      .confetti-piece, .result.celebrate .result-emoji { animation: none; }
      .confetti-piece { opacity: .9; }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-labelledby="app-title">
    <div class="brand">
      <span class="brand-name"><span class="brand-mark" aria-hidden="true">✦</span> Cosmic Quest</span>
      <span class="brand-status">Mission ready</span>
    </div>

    <section class="screen intro" id="welcome-screen">
      <div class="hero-emoji" aria-hidden="true">🚀</div>
      <p class="eyebrow">Your mission starts here</p>
      <h1 id="app-title">Space Exploration Quiz</h1>
      <p>Explore planets, stars, and the mysteries beyond. Ten questions stand between you and mission control.</p>
      <button class="button" id="start-button" type="button">Begin mission <span aria-hidden="true">→</span></button>
    </section>

    <section class="screen" id="quiz-screen" hidden aria-labelledby="question-text">
      <div class="quiz-top">
        <div class="stats">
          <span id="progress-label">Question 1 of 10</span>
          <span class="score" id="score-label">★ &nbsp;Score: 0</span>
        </div>
        <div class="progress-track" id="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <p class="question-number" id="question-number">Question 01</p>
      <h2 id="question-text" tabindex="-1"></h2>
      <div class="answers" id="answer-list"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="actions">
        <button class="button next" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section class="screen result" id="result-screen" hidden aria-labelledby="result-title">
      <div class="celebration-confetti" id="celebration-confetti" aria-hidden="true" hidden>
        <span class="confetti-piece" style="--confetti-x:-150px;--confetti-y:-75px;--confetti-rotation:-35deg;--confetti-color:#f08bc5"></span>
        <span class="confetti-piece" style="--confetti-x:-112px;--confetti-y:-112px;--confetti-rotation:55deg;--confetti-color:#7555e8"></span>
        <span class="confetti-piece" style="--confetti-x:-72px;--confetti-y:-145px;--confetti-rotation:25deg;--confetti-color:#f6c453"></span>
        <span class="confetti-piece" style="--confetti-x:-28px;--confetti-y:-125px;--confetti-rotation:-60deg;--confetti-color:#55bea1"></span>
        <span class="confetti-piece" style="--confetti-x:24px;--confetti-y:-145px;--confetti-rotation:70deg;--confetti-color:#ef8e69"></span>
        <span class="confetti-piece" style="--confetti-x:72px;--confetti-y:-122px;--confetti-rotation:15deg;--confetti-color:#8a79ee"></span>
        <span class="confetti-piece" style="--confetti-x:115px;--confetti-y:-100px;--confetti-rotation:-45deg;--confetti-color:#f08bc5"></span>
        <span class="confetti-piece" style="--confetti-x:155px;--confetti-y:-63px;--confetti-rotation:40deg;--confetti-color:#55bea1"></span>
        <span class="confetti-piece" style="--confetti-x:-165px;--confetti-y:-24px;--confetti-rotation:80deg;--confetti-color:#f6c453"></span>
        <span class="confetti-piece" style="--confetti-x:164px;--confetti-y:-15px;--confetti-rotation:-20deg;--confetti-color:#7555e8"></span>
        <span class="confetti-piece" style="--confetti-x:-132px;--confetti-y:26px;--confetti-rotation:20deg;--confetti-color:#ef8e69"></span>
        <span class="confetti-piece" style="--confetti-x:134px;--confetti-y:32px;--confetti-rotation:65deg;--confetti-color:#f08bc5"></span>
      </div>
      <div class="result-emoji" id="result-emoji" aria-hidden="true">🌟</div>
      <p class="eyebrow">Mission complete</p>
      <h2 id="result-title" tabindex="-1">Stellar work!</h2>
      <div class="final-score" id="final-score"></div>
      <p id="result-message"></p>
      <button class="button" id="restart-button" type="button">Launch again <span aria-hidden="true">↻</span></button>
    </section>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Mercury"], answer: 1 },
      { question: "What is the name of the galaxy that contains our Solar System?", options: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], answer: 2 },
      { question: "Which planet has the largest and most visible ring system?", options: ["Saturn", "Neptune", "Uranus", "Earth"], answer: 0 },
      { question: "What force keeps planets in orbit around the Sun?", options: ["Magnetism", "Friction", "Gravity", "Radiation"], answer: 2 },
      { question: "Which was the first crewed mission to land humans on the Moon?", options: ["Voyager 1", "Apollo 11", "Gemini 8", "Sputnik 1"], answer: 1 },
      { question: "What is the closest star to Earth, other than the Sun?", options: ["Sirius", "Proxima Centauri", "Polaris", "Betelgeuse"], answer: 1 },
      { question: "Which planet is the largest in our Solar System?", options: ["Saturn", "Earth", "Neptune", "Jupiter"], answer: 3 },
      { question: "What do we call a rocky object that burns brightly as it enters Earth's atmosphere?", options: ["Asteroid", "Meteor", "Comet", "Moon"], answer: 1 },
      { question: "Which planet rotates on its side, with an extreme axial tilt?", options: ["Uranus", "Mars", "Venus", "Mercury"], answer: 0 },
      { question: "What is the name of NASA's most famous space telescope launched in 1990?", options: ["Kepler", "Chandra", "Hubble", "Webb"], answer: 2 }
    ];

    function shuffle(items) {
      const shuffled = [...items];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    const welcomeScreen = document.getElementById("welcome-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const progressLabel = document.getElementById("progress-label");
    const scoreLabel = document.getElementById("score-label");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");
    const questionNumber = document.getElementById("question-number");
    const questionText = document.getElementById("question-text");
    const answerList = document.getElementById("answer-list");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");

    let missionQuestions = [];
    let previousQuestionOrder = [];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function showScreen(screen) {
      [welcomeScreen, quizScreen, resultScreen].forEach((item) => {
        item.hidden = item !== screen;
      });
    }

    function renderQuestion() {
      const item = missionQuestions[currentQuestion];
      answered = false;
      progressLabel.textContent = `Question ${currentQuestion + 1} of ${missionQuestions.length}`;
      scoreLabel.textContent = `★  Score: ${score}`;
      questionNumber.textContent = `Question ${String(currentQuestion + 1).padStart(2, "0")}`;
      questionText.textContent = item.question;
      progressTrack.setAttribute("aria-valuenow", String(currentQuestion));
      progressFill.style.width = `${(currentQuestion / missionQuestions.length) * 100}%`;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      answerList.replaceChildren();

      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
        button.addEventListener("click", () => selectAnswer(index));
        answerList.appendChild(button);
      });
    }

    function selectAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = missionQuestions[currentQuestion];
      const correct = selected === item.answer;
      const buttons = [...answerList.querySelectorAll(".answer")];
      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) button.classList.add("correct");
        if (index === selected && !correct) button.classList.add("wrong");
      });
      if (correct) {
        score += 1;
        feedback.textContent = "Brilliant! That's the right answer. ✨";
        feedback.classList.add("good");
      } else {
        feedback.textContent = `Not quite — ${item.options[item.answer]} is correct.`;
        feedback.classList.add("bad");
      }
      scoreLabel.textContent = `★  Score: ${score}`;
      progressTrack.setAttribute("aria-valuenow", String(currentQuestion + 1));
      progressFill.style.width = `${((currentQuestion + 1) / missionQuestions.length) * 100}%`;
      nextButton.textContent = currentQuestion === missionQuestions.length - 1 ? "See results  ✦" : "Next question  →";
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      const percent = score / missionQuestions.length;
      const result = percent === 1
        ? ["🏆", "Perfect orbit!", "A flawless flight! You know your way around the cosmos."]
        : percent >= 0.8
          ? ["🌟", "Stellar work!", "The universe has few secrets from you. What a cosmic score!"]
          : percent >= 0.5
            ? ["🪐", "Great exploring!", "You have a strong start. There is always more universe to discover!"]
            : ["🌱", "Rookie astronaut!", "Every explorer starts somewhere. Ready to try another mission?"];
      const celebration = score >= 8;
      resultScreen.classList.toggle("celebrate", celebration);
      document.getElementById("celebration-confetti").hidden = !celebration;
      document.getElementById("result-emoji").textContent = result[0];
      document.getElementById("result-title").textContent = result[1];
      document.getElementById("final-score").textContent = `${score} / ${missionQuestions.length} correct`;
      document.getElementById("result-message").textContent = result[2];
      showScreen(resultScreen);
      document.getElementById("result-title").focus();
    }

    function startMission() {
      let questionOrder = shuffle(questions);
      if (
        previousQuestionOrder.length === questionOrder.length
        && questionOrder.every((question, index) => question === previousQuestionOrder[index])
      ) {
        [questionOrder[0], questionOrder[1]] = [questionOrder[1], questionOrder[0]];
      }
      previousQuestionOrder = [...questionOrder];
      missionQuestions = questionOrder.map((question) => {
        const options = shuffle(question.options.map((text, index) => ({
          text,
          correct: index === question.answer
        })));
        return {
          ...question,
          options: options.map((option) => option.text),
          answer: options.findIndex((option) => option.correct)
        };
      });
      currentQuestion = 0;
      score = 0;
      renderQuestion();
      showScreen(quizScreen);
      questionText.focus();
    }

    document.getElementById("start-button").addEventListener("click", startMission);

    nextButton.addEventListener("click", () => {
      if (currentQuestion < missionQuestions.length - 1) {
        currentQuestion += 1;
        renderQuestion();
        questionText.focus();
      } else {
        showResults();
      }
    });

    document.getElementById("restart-button").addEventListener("click", startMission);
  </script>
</body>
</html>
